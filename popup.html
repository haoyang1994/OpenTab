<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加到 OpenTab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1>添加到 OpenTab</h1>
    <p id="current-url" class="url"></p>

    <label for="site-name">名称</label>
    <input id="site-name" type="text" placeholder="请输入图标名称">

    <label for="folder-select">抽屉</label>
    <select id="folder-select"></select>

    <div class="actions">
      <button id="save-btn" class="primary" type="button">保存</button>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
