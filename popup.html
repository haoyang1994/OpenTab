<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="添加到 OpenTab">添加到 OpenTab</title>
  <script src="i18n.js"></script>
  <script src="locales/static-en.js"></script>
  <script src="locales/core-en.js"></script>
  <script src="locales/services-en.js"></script>
  <script src="locales/scenes-en.js"></script>
  <link rel="icon" type="image/svg+xml" href="icons/opentab-icon.svg">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <h1 data-i18n="添加到 OpenTab">添加到 OpenTab</h1>
    <p id="current-url" class="url"></p>

    <label for="site-name" data-i18n="名称">名称</label>
    <input id="site-name" type="text" placeholder="请输入图标名称" data-i18n-placeholder="请输入图标名称">

    <label for="folder-select" data-i18n="分组">分组</label>
    <select id="folder-select"></select>

    <div class="actions">
      <button id="save-btn" class="primary" type="button" data-i18n="保存">保存</button>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="scene-schema.js"></script>
  <script src="workspace-persistence.js"></script>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
