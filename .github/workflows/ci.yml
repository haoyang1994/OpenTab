name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Dependency downloads have a separate bounded budget from test execution.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Baseline comparisons must have real origin/master history, never a zero-byte fallback.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for high-severity advisories
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        timeout-minutes: 18
        run: npx playwright install --with-deps chromium

      # Fail fast on the explicit tab-creation boundary before the broad suite.
      # The canonical npm test still reruns every suite, including this one.
      - name: Check explicit group launch in native Chromium
        timeout-minutes: 3
        run: xvfb-run -a env HEADLESS=false PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS=1 node tests/group-launch.test.mjs

      - name: Run tests
        timeout-minutes: 15
        run: npm test

      - name: Verify extracted release candidate
        timeout-minutes: 3
        run: |
          npm run test:package:smoke
          (cd dist && sha256sum opentab-*.zip > SHA256SUMS)

      - name: Upload unsigned tested extension candidate
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-extension-candidate
          path: |
            dist/opentab-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            artifacts/*.png
            artifacts/accessibility-contrast.json
            artifacts/accessibility-chooser.json
            artifacts/wallpaper-readability.json
            artifacts/group-launch-*.json
          if-no-files-found: ignore
          retention-days: 7
