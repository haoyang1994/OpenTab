name: Feature request
description: Suggest an enhancement for OpenTab
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the smallest change that would help.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or inconvenient in the current new tab experience?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should OpenTab do instead? Keep it specific and in scope for a new tab page.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or considered.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, related issues, or notes about permissions / network access the feature would need.
    validations:
      required: false
