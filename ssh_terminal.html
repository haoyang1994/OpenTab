<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH Terminal</title>
  <link id="page-favicon" rel="icon" type="image/svg+xml" href="">
  <link rel="stylesheet" href="node_modules/xterm/css/xterm.css">
  <link rel="stylesheet" href="ssh_terminal.css">
</head>
<body>
  <div class="terminal-page">
    <header class="terminal-header">
      <div>
        <h1 id="title">SSH Terminal</h1>
        <p id="meta">准备连接...</p>
      </div>
      <div class="actions">
        <span id="status" class="status status-idle">未连接</span>
        <button id="toggle-sidebar-btn" type="button" title="文件树">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button id="fullscreen-btn" type="button">全屏</button>
        <button id="disconnect-btn" type="button">断开连接</button>
      </div>
    </header>
    <div class="terminal-main">
      <main id="terminal" class="terminal-container" aria-label="SSH terminal"></main>
      <aside id="file-sidebar" class="file-sidebar hidden">
        <div class="sidebar-header">
          <span>文件浏览器</span>
          <div class="sidebar-actions">
            <button id="go-up-btn" class="sidebar-btn" title="返回上级">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 11l-5-5-5 5M17 18l-5-5-5 5"></path>
              </svg>
            </button>
            <button id="refresh-files-btn" class="sidebar-btn" title="刷新">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6M1 20v-6h6"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="file-path-bar">
          <input type="text" id="file-path-input" class="file-path-input" placeholder="输入路径...">
        </div>
        <div class="file-tree-container" id="file-tree-container">
          <div class="file-tree-empty">连接后加载文件树</div>
        </div>
      </aside>
    </div>
  </div>

  <div id="context-menu" class="context-menu hidden">
    <button id="ctx-upload" type="button">上传文件到此处</button>
    <button id="ctx-download" type="button">下载</button>
    <button id="ctx-compress" type="button">压缩</button>
  </div>

  <input type="file" id="upload-input" hidden multiple>

  <script src="node_modules/xterm/lib/xterm.js"></script>
  <script src="node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="ssh_terminal.js"></script>
</body>
</html>
